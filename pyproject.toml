[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "silicorism"
version = "0.1.0"
description = "Silicon + Tribalism: high-throughput multi-agent task orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
silicorism = "cli:main"
silicorism-mcp = "silicorism_mcp:main"
silicorism-msg = "cli:msg_main"

[tool.setuptools]
# Flat single-file modules — no package dir. `pip install -e .` / pipx expose
# the console entry points globally; each resolves its DB per-repo (git root's
# .git/silicorism.db, else ~/.config/silicorism/repos/<slug>/), never from CWD.
py-modules = ["cli", "db", "handlers", "worker", "silicorism_tools",
              "tmux_orchestrator", "skills", "silicorism_mcp"]
